{%extends 'base_layout.html'%} {%block content%}
<div class="container py-4">
  <h3>Date : {{Date}}</h3>
  <h3>Send SMS To:</h3>
  <div class="row">
    <div class="col-12 col-md-8 col-lg-6 mx-auto">
      {% if Client is none %}
      <form action="{% url 'microfinance:sms' %}" method="POST" class="card card-body shadow-sm mb-4">
        {% csrf_token %}
        <input type="hidden" name="Date" value="{{Date}}">
        <div class="form-check mb-2">
          <input type="checkbox" class="form-check-input" id="select-all">
          <label class="form-check-label" for="select-all">Select All</label>
        </div>
        {% for k, y in dic.items %}
        <div class="form-check mb-2">
          <input type="checkbox" class="form-check-input" id="check-{{k.pk}}" name="Check" value="{{k.pk}}">
          <label class="form-check-label" for="check-{{k.pk}}">{{k.Account.Client.Name}} - {{y}}</label>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100 mt-3" name="Datewise">Send SMS</button>
      </form>
      {% elif Client.count %}
      <form action="{% url 'microfinance:sms' %}" method="POST" class="card card-body shadow-sm mb-4">
        {% csrf_token %}
        <input type="hidden" name="Date" value="{{Date}}">
        <div class="mb-3">
          <textarea cols="50" rows="2" placeholder="Write your Message here" name="message" class="form-control"></textarea>
        </div>
        <div class="form-check mb-2">
          <input type="checkbox" class="form-check-input" id="select-all">
          <label class="form-check-label" for="select-all">Select All</label>
        </div>
        {% for i in Client %}
        <div class="form-check mb-2">
          <input type="checkbox" class="form-check-input" id="check-{{i.pk}}" name="Check" value="{{i.pk}}">
          <label class="form-check-label" for="check-{{i.pk}}">{{i.pk}} - {{i.Name}}</label>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100 mt-3" name="CustomSms">Send SMS</button>
      </form>
      {% endif %}
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('#select-all').forEach(function(selectAll) {
    selectAll.onclick = function() {
      var form = selectAll.closest('form');
      var checkboxes = form.querySelectorAll('input[type="checkbox"][name="Check"]');
      for (var checkbox of checkboxes) {
        checkbox.checked = selectAll.checked;
      }
    }
  });
</script>
{%endblock%}
