{%extends 'base_layout.html'%}{% load static %} {% block content %}
<div class="container py-4">
  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">OfficerWise Report</h5>
          <form action="{% url 'microfinance:report1'%}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Officer</label>
              <select name="name" class="form-select mb-2">
                {% for user in users %}{% if user.pk != 0 %}
                  <option value="{{user.pk}}">{{user}}</option>{% endif %}
                {% endfor %}
                <option value="0">All</option>
              </select>
              <label class="form-label">Frequency</label>
              <select name="loan" class="form-select mb-2">
                <option value="0">All</option>
                <option value="1">Daily</option>
                <option value="2">Weekly</option>
                <option value="3">Monthly</option>
              </select>
              <label class="form-label">Status</label>
              <select name="status" class="form-select mb-2">
                <option value="False">Active Cases</option>
                <option value="True">Closed Cases</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Search</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Officerwise Collection Report</h5>
          <form action="{% url 'microfinance:report' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Officer</label>
              <select name="name" class="form-select mb-2">
                {% for user in users %}{% if user.pk != 0 %}
                  <option value="{{user.pk}}">{{user}}</option>{% endif %}
                {% endfor %}
                <option value="0">All</option>
              </select>
              <label class="form-label">Frequency</label>
              <select name="loan" class="form-select mb-2">
                <option value="0">All</option>
                <option value="1">Daily</option>
                <option value="2">Weekly</option>
                <option value="3">Monthly</option>
              </select>
              <label class="form-label">From</label>
              <input type="date" name="from" class="form-control mb-2" placeholder="From:" />
              <label class="form-label">To</label>
              <input type="date" name="to" class="form-control mb-2" placeholder="To:" />
            </div>
            <button type="submit" class="btn btn-primary w-100">Search</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Total Amount Collection Report</h5>
          <form action="{% url 'microfinance:report5' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">On Date</label>
              <input type="date" name="Date" class="form-control mb-2" placeholder="Date" />
            </div>
            <button type="submit" class="btn btn-primary w-100">Search</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Daily Clients Chart</h5>
          <form action="{% url 'microfinance:report6' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Officer</label>
              <select name="name" class="form-select mb-2">
                {% for user in users %}{% if user.pk != 0 %}
                  <option value="{{user.pk}}">{{user}}</option>{% endif %}
                {% endfor %}
                <option value="0">All</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Search</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">Week Chart</h5>
          <form action="{% url 'microfinance:report7' %}" method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Weekday</label>
              <select name="Weekday" class="form-select mb-2">
                <option value="2">Mon</option>
                <option value="3">Tue</option>
                <option value="4">Wed</option>
                <option value="5">Thu</option>
                <option value="6">Fri</option>
                <option value="7">Sat</option>
                <option value="1">Sun</option>
                <option value="0">All</option>
              </select>
              <label class="form-label">Officer</label>
              <select name="name" class="form-select mb-2">
                {% for user in users %}{% if user.pk != 0 %}
                  <option value="{{user.pk}}">{{user}}</option>{% endif %}
                {% endfor %}
                <option value="0">All</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Search</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
