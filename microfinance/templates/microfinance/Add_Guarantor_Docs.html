{%extends 'base_layout.html'%} {%block content%}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="mb-3">Add Guarantor Document</h4>
          <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_Image" class="form-label">Image</label>
              <input type="file" name="Image" accept="image/*" id="id_Image" class="form-control">
            </div>
            <div class="d-flex gap-2">
              <button type="submit" name="k" class="btn btn-secondary flex-fill">Add More</button>
              <button type="submit" name="l" class="btn btn-success flex-fill">Save & Exit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{%endblock%}
