{%extends 'base_layout.html'%} {%block content%}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h2 class="card-title text-center mb-3">ESSARR FINANCE</h2>
      <h4 class="text-center mb-4">Login</h4>
      <form class="needs-validation" action="/accounts/login/" method="POST" novalidate>
        {%csrf_token%}
        <div class="mb-3">
          <label for="id_username" class="form-label">Username</label>
          <input type="text" name="username" class="form-control" id="id_username" required autofocus>
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label">Password</label>
          <input type="password" name="password" class="form-control" id="id_password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
</div>
{%endblock%}
